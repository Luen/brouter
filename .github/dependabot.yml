# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates
# Minor and patch updates are grouped per ecosystem; major updates open individual PRs.
version: 2
updates:
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'master'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'master'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'master'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'master'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
